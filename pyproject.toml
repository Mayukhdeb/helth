[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helth"
version = "0.1.0"
description = "Read Apple Health exports and turn them into insights (biological age, activity, vitals)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mayukh Deb" }]
dependencies = ["pandas>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["helth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
